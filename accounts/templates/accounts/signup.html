<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up – NT Training Pathways</title>
    <link rel="stylesheet" href="/static/training/styles.css">
    <link rel="stylesheet" href="/static/accounts/styles.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <h2>Create Account</h2>

            {% if form.non_field_errors %}
                <div class="errors">{{ form.non_field_errors }}</div>
            {% endif %}

            <form method="post">
                {% csrf_token %}
                {% for field in form %}
                    <div class="field">
                        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                        {{ field }}
                        {% if field.help_text %}<div class="helptext">{{ field.help_text }}</div>{% endif %}
                        {% if field.errors %}<div class="errors">{{ field.errors }}</div>{% endif %}
                    </div>
                {% endfor %}
                <button type="submit">Sign Up</button>
            </form>

            <div class="auth-footer">
                Already have an account? <a href="{% url 'accounts:login' %}">Log in</a>
            </div>
        </div>
    </div>
</body>
</html>
